# Postgres for trying the data examples against a real server.
#
#   docker compose up -d     start it in the background
#   docker compose down      stop it and remove the container
#
# Database, user, and password are all "app", matching the Config in the data
# guide (docs/data.md). The example under users-crud runs on SQLite by default;
# switch its connection to `connect` with this Config to run against Postgres.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      # Probe over TCP, which is how the examples connect. On first start the
      # image runs initdb behind a temporary socket-only server; a plain
      # `pg_isready` answers for that one and reports healthy a few seconds
      # before the real server exists, so the first query gets "the database
      # system is shutting down". start_period covers initdb without spending
      # retries on it.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
