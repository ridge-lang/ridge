name: Feature request
description: Suggest a new feature or enhancement for Ridge
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature.

  - type: checkboxes
    id: dupes
    attributes:
      label: Duplicate search
      description: Confirm you searched existing issues before filing.
      options:
        - label: I searched open and closed issues for this feature (e.g. `tools/dev/issue-dupes.sh <keywords>` or `gh issue list --search "<keywords>"`) and found no duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you would like to see. Include example code if applicable.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: context
    attributes:
      label: Additional context
